# Copy this file to config.yml and keep config.yml mode 0600.
telegram:
  api_id: "123456"
  api_hash: "telegram-api-hash"
  main:
    username: "@MainOwnerAccount"
    session: ".session/main"
  # Empty means replacements are transferred directly to main.
  pool: []
  # To enable the privacy proxy, replace the empty list with ordered accounts:
  # pool:
  #   - username: "@PoolAccountOne"
  #     session: ".session/pool-one"
  #   - username: "@PoolAccountTwo"
  #     session: ".session/pool-two"

announcement:
  channel: "@YourAnnouncementChannel"
  group: "@YourAnnouncementGroup"
  recovery_template: |
    {friendly_name} is being restored. Create a bot named {handle_prefix}<number>bot,
    then send its username to {anonymous_link}.
  restored_template: "{friendly_name} has been restored: {new_handle}"

# Enable to keep the IncogNote link active after recovery. Later valid bot
# submissions are collected as spares, transferred to the main account, and
# used by automatic recovery before creating a new bot.
anonymous_submissions:
  retain_link_after_recovery: false
  donation_template: "Contribute a spare {friendly_name} bot by sending its @username here: {anonymous_link}"

cloudflare:
  project_name: "your-pages-project"
  pages_url: "https://your-pages-project.pages.dev"
  # Authenticate Wrangler separately, for example with `wrangler login`.

# Set enabled to true to restore automatically, creating a bot if needed.
# A saved spare is used automatically even when enabled is false. A creator
# account is only needed when the spare queue is empty.
# Set prepare_bots to true to keep one already-transferred backup per configured bot.
# For donated-spare-only operation, keep prepare_bots false and omit creator;
# an empty queue falls back to manual recovery.
automatic_recovery:
  enabled: false
  prepare_bots: false
  creator:
    username: "@BackupBotCreatorAccount"
    session: ".session/creator"
    api_id: "123456"
    api_hash: "creator-telegram-api-hash"
    # Optional; quote numeric passwords so YAML reads them as strings.
    # password: "your-2FA-password"

# State contains handles, backup and donation queues, message IDs, and anonymous links; tokens never enter it.
state_path: ".state/recovery.json"
snapshot_dir: ".state/snapshots"

bots:
  - handle_prefix: "ExampleRelay"
    friendly_name: "Example relay"
    # Current bot handle: checked when the recovery service starts and used to
    # create the first snapshot. It is updated automatically after recovery.
    handle: "@AnyExistingSnapshotSourceBot"
    # Use an absolute path in production. Relative paths are based on transfer/.
    config_path: "/srv/example-relay/config.yml"
    # Dotted key in the deployed bot's YAML configuration.
    token_path: "telegram.token"
    restart_command: ["systemctl", "restart", "example-relay.service"]
